# Postgres only, for local development. Deployments use Supabase; BullMQ runs on the same
# database (PostgreSQL backend) and the cache talks to Upstash over HTTP or falls back to an
# in-process Map, so there is no local Redis to run.
services:
  postgres:
    image: postgres:17-alpine
    container_name: posly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: posly
      POSTGRES_PASSWORD: posly
      POSTGRES_DB: posly
    ports:
      - "5434:5432"
    volumes:
      - posly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  posly-pgdata:
