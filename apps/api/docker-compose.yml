# Postgres and Redis for local development; deployments use the same two on Railway.
# Redis is optional locally: without REDIS_URL the cache falls back to an in-process Map, and
# no BullMQ queue is registered yet.
services:
  postgres:
    image: postgres:17-alpine
    container_name: posly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: posly
      POSTGRES_PASSWORD: posly
      POSTGRES_DB: posly
    ports:
      - "5434:5432"
    volumes:
      - posly-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: posly-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  posly-pgdata:
